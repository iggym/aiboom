[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibom"
version = "0.1.0"
description = "Generate an audit-ready AI Bill of Materials (CycloneDX 1.6) from your repo, in one command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "modelsurface" }]
keywords = [
  "aibom",
  "ai-bom",
  "cyclonedx",
  "sbom",
  "ml-bom",
  "ai-governance",
  "eu-ai-act",
  "iso-42001",
  "supply-chain",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
# `surfacelock` is the canonical AI-surface scanner and the producer of
# `surface.lock`. When it is importable aibom delegates to it; otherwise aibom
# falls back to its own bundled deterministic scanner so the tool still works
# in an air-gapped or dependency-minimal environment. See docs/inputs.md.
scanner = ["surfacelock>=0.1"]
pdf = ["weasyprint>=60"]
sign = ["sigstore>=2.0"]
xml = ["lxml>=4.9"]
all = ["aibom[scanner,pdf,sign,xml]"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/modelsurface/aibom"
Repository = "https://github.com/modelsurface/aibom"
Documentation = "https://modelsurface.github.io/aibom/"
Changelog = "https://github.com/modelsurface/aibom/releases"
Issues = "https://github.com/modelsurface/aibom/issues"

[project.scripts]
aibom = "aibom.cli:main"

[project.entry-points."pre_commit.hooks"]
aibom-generate = "aibom.integrations.precommit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aibom"]

[tool.hatch.build.targets.wheel.force-include]
"src/aibom/schemas" = "aibom/schemas"
"src/aibom/risk/rules" = "aibom/risk/rules"
"src/aibom/render/templates" = "aibom/render/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests that need an external service (e.g. Dependency-Track); deselect with '-m \"not slow\"'",
  "cosign: marks tests that need a local cosign binary",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["aibom"]
ignore_missing_imports = true
